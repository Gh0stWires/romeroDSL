name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate example
        run: python -m romerodsl validate examples/blue_lock_processing.json
      - name: Export example WAD
        run: python -m romerodsl export-wad examples/blue_lock_processing.json --output build/blue_lock_processing.wad
